<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="920" viewBox="0 0 1800 920" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">MiLe loss data flow inside Cut Cross Entropy</title>
  <desc id="desc">Three spacious panels show streaming CCE statistics, detached mean-normalized MiLe weights, and the weighted blockwise CCE backward pass without materializing a token-by-vocabulary tensor.</desc>
  <defs>
    <marker id="mileArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#59616a"/>
    </marker>
    <style>
      .title { font: 700 34px Georgia, serif; fill: #222a31; }
      .subtitle { font: 18px Arial, sans-serif; fill: #5e6872; }
      .panel-title { font: 700 25px Georgia, serif; fill: #222a31; }
      .section { font: 700 16px Arial, sans-serif; letter-spacing: .7px; fill: #6a737c; }
      .label { font: 18px Arial, sans-serif; fill: #404a53; }
      .small { font: 16px Arial, sans-serif; fill: #4f5962; }
      .tiny { font: 14px Arial, sans-serif; fill: #5f6972; }
      .math { font: italic 23px Georgia, serif; fill: #ffffff; }
      .math-dark { font: italic 21px Georgia, serif; fill: #303941; }
      .mono { font: 16px 'Courier New', monospace; fill: #303941; }
      .white { fill: #ffffff; }
      .flow { stroke: #59616a; stroke-width: 2.6; fill: none; marker-end: url(#mileArrow); }
      .guide { stroke: #87919a; stroke-width: 2; fill: none; stroke-dasharray: 7 6; }
    </style>
  </defs>

  <rect width="1800" height="920" fill="#ffffff"/>
  <text x="900" y="46" text-anchor="middle" class="title">MiLe Loss inside Cut Cross Entropy</text>
  <text x="900" y="78" text-anchor="middle" class="subtitle">Stream logits by vocabulary tile · save O(N) statistics · never materialize the N × V logit matrix</text>

  <!-- Panel A: forward statistics -->
  <rect x="30" y="112" width="560" height="700" rx="16" fill="#fbfaf7" stroke="#d7d3ca" stroke-width="2"/>
  <text x="310" y="151" text-anchor="middle" class="panel-title">(a) Streaming CCE statistics</text>
  <text x="310" y="180" text-anchor="middle" class="section">FOR EACH TOKEN BLOCK n AND VOCABULARY TILE v</text>

  <rect x="70" y="214" width="170" height="92" fill="#f1dfbb"/>
  <rect x="120" y="214" width="70" height="92" fill="#eda336"/>
  <text x="155" y="267" text-anchor="middle" class="math">Eₙ</text>
  <text x="155" y="329" text-anchor="middle" class="small">token embeddings</text>

  <rect x="380" y="214" width="170" height="92" fill="#aebbc8"/>
  <rect x="380" y="237" width="170" height="48" fill="#3f82b7"/>
  <text x="465" y="269" text-anchor="middle" class="math">Cᵀᵥ</text>
  <text x="465" y="329" text-anchor="middle" class="small">classifier tile</text>

  <path d="M 240 260 L 288 353" class="flow"/>
  <path d="M 380 260 L 332 353" class="flow"/>
  <rect x="205" y="350" width="210" height="96" rx="9" fill="#555d66"/>
  <text x="310" y="390" text-anchor="middle" class="math">zₙᵥ = Eₙ Cᵀᵥ</text>
  <text x="310" y="419" text-anchor="middle" class="small white">register tile; not stored globally</text>

  <path d="M 310 447 L 310 480" class="flow"/>
  <rect x="70" y="482" width="480" height="218" rx="10" fill="#ffffff" stroke="#9fa7ae" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="310" y="514" text-anchor="middle" class="section">ONLINE REDUCTIONS ACROSS v</text>
  <rect x="100" y="535" width="420" height="40" rx="6" fill="#f5ebe9"/>
  <text x="310" y="561" text-anchor="middle" class="mono">LSEₙ = log Σⱼ exp(zₙⱼ)</text>
  <rect x="100" y="588" width="420" height="40" rx="6" fill="#f8eee7"/>
  <text x="310" y="614" text-anchor="middle" class="mono">mₙ = Σⱼ pₙⱼ zₙⱼ = Eₚ[zₙ]</text>
  <rect x="100" y="641" width="420" height="40" rx="6" fill="#f2e8e7"/>
  <text x="310" y="667" text-anchor="middle" class="mono">NLLₙ = LSEₙ − zₙ,yₙ</text>

  <path d="M 310 701 L 310 733" class="flow"/>
  <rect x="175" y="734" width="270" height="44" rx="7" fill="#bd665c"/>
  <text x="310" y="762" text-anchor="middle" class="small white">compact FP32 vectors [N]</text>

  <!-- Panel B: MiLe weighting -->
  <rect x="620" y="112" width="560" height="700" rx="16" fill="#fbfaf7" stroke="#d7d3ca" stroke-width="2"/>
  <text x="900" y="151" text-anchor="middle" class="panel-title">(b) Fused MiLe weighting</text>
  <text x="900" y="180" text-anchor="middle" class="section">ENTROPY → RAW WEIGHT → MEAN-ONE WEIGHT</text>

  <rect x="655" y="210" width="130" height="46" rx="6" fill="#bd665c"/>
  <text x="720" y="239" text-anchor="middle" class="small white">LSEₙ</text>
  <rect x="835" y="210" width="130" height="46" rx="6" fill="#d69a70"/>
  <text x="900" y="239" text-anchor="middle" class="small white">mₙ = Eₚ[zₙ]</text>
  <rect x="1015" y="210" width="130" height="46" rx="6" fill="#c8a5a0"/>
  <text x="1080" y="239" text-anchor="middle" class="small white">NLLₙ</text>

  <path d="M 720 257 L 815 300" class="flow"/>
  <path d="M 900 257 L 900 292" class="flow"/>
  <rect x="750" y="294" width="300" height="66" rx="9" fill="#555d66"/>
  <text x="900" y="335" text-anchor="middle" class="math">Hₙ = max(LSEₙ − mₙ, 0)</text>

  <path d="M 900 361 L 900 397" class="flow"/>
  <rect x="785" y="399" width="230" height="60" rx="9" fill="#eda336"/>
  <text x="900" y="437" text-anchor="middle" class="math">aₙ = (1 + Hₙ)ᵞ</text>

  <path d="M 850 460 L 770 503" class="flow"/>
  <path d="M 950 460 L 1030 503" class="flow"/>
  <rect x="650" y="505" width="240" height="82" rx="9" fill="#eef4f7" stroke="#6f94ad" stroke-width="2"/>
  <text x="770" y="537" text-anchor="middle" class="small">N ≤ 16,384</text>
  <text x="770" y="563" text-anchor="middle" class="tiny">one Triton program</text>
  <rect x="910" y="505" width="240" height="82" rx="9" fill="#eef4f7" stroke="#6f94ad" stroke-width="2"/>
  <text x="1030" y="537" text-anchor="middle" class="small">N &gt; 16,384</text>
  <text x="1030" y="563" text-anchor="middle" class="tiny">partial sums + normalize kernel</text>

  <path d="M 770 588 C 770 615, 835 613, 865 630" class="flow"/>
  <path d="M 1030 588 C 1030 615, 965 613, 935 630" class="flow"/>
  <rect x="725" y="628" width="350" height="66" rx="9" fill="#4fa765"/>
  <text x="900" y="668" text-anchor="middle" class="math">wₙ = stopgrad(aₙ / mean(a))</text>

  <path d="M 900 695 L 900 729" class="flow"/>
  <path d="M 1080 257 L 1160 290 L 1160 700 Q 1160 755 1045 755" class="flow"/>
  <rect x="775" y="731" width="270" height="48" rx="7" fill="#86bb93"/>
  <text x="910" y="762" text-anchor="middle" class="math">ℓₙ = wₙ · NLLₙ</text>

  <!-- Panel C: backward -->
  <rect x="1210" y="112" width="560" height="700" rx="16" fill="#fbfaf7" stroke="#d7d3ca" stroke-width="2"/>
  <text x="1490" y="151" text-anchor="middle" class="panel-title">(c) Weighted CCE backward</text>
  <text x="1490" y="180" text-anchor="middle" class="section">RECOMPUTE LOGITS, THEN SCALE CE GRADIENTS</text>

  <rect x="1255" y="213" width="150" height="82" fill="#f1dfbb"/>
  <rect x="1297" y="213" width="66" height="82" fill="#eda336"/>
  <text x="1330" y="263" text-anchor="middle" class="math">Eₙ</text>
  <rect x="1575" y="213" width="150" height="82" fill="#aebbc8"/>
  <rect x="1575" y="234" width="150" height="44" fill="#3f82b7"/>
  <text x="1650" y="264" text-anchor="middle" class="math">Cᵀᵥ</text>
  <path d="M 1406 255 L 1450 328" class="flow"/>
  <path d="M 1574 255 L 1530 328" class="flow"/>

  <rect x="1400" y="326" width="180" height="70" rx="9" fill="#555d66"/>
  <text x="1490" y="356" text-anchor="middle" class="math">zₙᵥ</text>
  <text x="1490" y="382" text-anchor="middle" class="tiny white">recomputed in registers</text>
  <path d="M 1490 397 L 1490 430" class="flow"/>

  <rect x="1330" y="432" width="320" height="92" rx="9" fill="#ffffff" stroke="#9fa7ae" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="1490" y="467" text-anchor="middle" class="mono">gₙᵥ = exp(zₙᵥ − LSEₙ)</text>
  <text x="1490" y="500" text-anchor="middle" class="mono">gₙᵥ −= 1[v = yₙ]</text>

  <rect x="1245" y="565" width="170" height="58" rx="8" fill="#4fa765"/>
  <text x="1330" y="601" text-anchor="middle" class="math">load wₙ</text>
  <path d="M 1416 594 L 1444 594" class="flow"/>
  <path d="M 1490 525 L 1530 558" class="flow"/>
  <rect x="1445" y="555" width="270" height="78" rx="9" fill="#555d66"/>
  <text x="1580" y="591" text-anchor="middle" class="math">ĝₙᵥ = wₙ · gₙᵥ</text>
  <text x="1580" y="617" text-anchor="middle" class="tiny white">wₙ is constant in this backward</text>

  <path d="M 1580 634 C 1580 674, 1438 680, 1375 713" class="flow"/>
  <path d="M 1580 634 C 1580 674, 1644 682, 1650 713" class="flow"/>
  <rect x="1265" y="715" width="220" height="52" rx="7" fill="#3f82b7"/>
  <text x="1375" y="748" text-anchor="middle" class="math">∇Eₙ</text>
  <rect x="1540" y="715" width="220" height="52" rx="7" fill="#3f82b7"/>
  <text x="1650" y="748" text-anchor="middle" class="math">∇Cᵀᵥ</text>

  <!-- Legend and key conclusion -->
  <rect x="30" y="838" width="1740" height="56" rx="10" fill="#f4f6f7" stroke="#d7dde1"/>
  <rect x="58" y="855" width="25" height="20" fill="#bd665c"/><text x="94" y="871" class="tiny">saved statistic</text>
  <rect x="230" y="855" width="25" height="20" fill="#eda336"/><text x="266" y="871" class="tiny">derived value</text>
  <rect x="385" y="855" width="25" height="20" fill="#4fa765"/><text x="421" y="871" class="tiny">detached weight</text>
  <rect x="568" y="855" width="25" height="20" fill="#3f82b7"/><text x="604" y="871" class="tiny">model gradient</text>
  <text x="1740" y="871" text-anchor="end" class="label">Detach blocks ∂w/∂θ; it does not block the multiplier wₙ on the CE gradient.</text>
</svg>
