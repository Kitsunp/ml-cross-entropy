repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
        -   id: trailing-whitespace
        -   id: check-merge-conflict
        -   id: check-yaml
        -   id: end-of-file-fixer
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.5
    hooks:
        -   id: ruff
            args: [ --fix, --show-fixes ]
            types: [python]
        -   id: ruff-format
            types: [python]
-   repo: local
    hooks:
        -   id: publication-boundary-staged
            name: publication boundary (staged files)
            entry: python scripts/verify_publication_boundary.py --staged
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-commit]
        -   id: publication-boundary-tree
            name: publication boundary (tracked tree)
            entry: python scripts/verify_publication_boundary.py --tree
            language: system
            pass_filenames: false
            always_run: true
            stages: [pre-push]
